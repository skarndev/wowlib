# The immutable value surfaces must reject assignment at type-check time, not only
# at runtime (test_surface / test_identity cover the runtime AttributeError).

- case: version_storage_kind_is_read_only
  main: |
    import wowlib
    wowlib.versions.wotlk.storage_kind = wowlib.StorageKind.Casc
  out: |
    main:2: error: Property "storage_kind" defined in "ClientVersion" is read-only  [misc]

- case: settings_fields_are_read_only
  main: |
    from pathlib import Path
    import wowlib
    s = wowlib.fs.FileSystemSettings(client_path="/c", version=wowlib.versions.wotlk)
    s.client_path = Path("/elsewhere")
  out: |
    main:4: error: Property "client_path" defined in "FileSystemSettings" is read-only  [misc]
