# Contracts that were previously stub<->runtime gaps (tracked as xfail) and are now
# fixed: exceptions expose typed .code/.native_error, and read() accepts any
# bytes-like buffer, not just bytes. Cases with no `out:` assert a clean type-check.

- case: exception_code_and_native_error_are_typed
  main: |
    import wowlib
    def handle(e: wowlib.StorageOpenFailed) -> None:
        code: str = e.code
        native: int = e.native_error

- case: read_accepts_any_bytes_like_buffer
  main: |
    import wowlib
    from wowlib.formats import wmo
    w = wmo.WMO.for_version(wowlib.Expansion.Wotlk)
    w.read(bytearray(b""), [])
    w.read(memoryview(b""), [])
    w.read(b"", [])
