name: ci-linux

on:
  push:
    branches: [main]
    # Docs-only pushes don't need builds or box time.
    paths-ignore:
      - '.claude/**'
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A single configuration per platform: Release, because it is what ships
# (wheels, NuGet, the audit/integration artifacts) and CI time should test
# that. The Debug configuration is a local development tool; nothing in it
# beyond assert() coverage differs, which is not worth a duplicate 75-min
# build per platform on every push.
jobs:
  # The release build doubles as the integration-artifact producer: the test
  # binary it uploads is what the self-hosted job below runs against the real
  # client fleet — no second build anywhere.
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - name: Install gcc-16 toolchain (Homebrew)
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix)/sbin" >> "$GITHUB_PATH"
          # `brew update` refreshes the taps and is the single flakiest step in
          # every job — a tap fetch failure killed a macOS run in 19s, before a
          # line of wowlib was compiled. It is also NOT fatal: the runner image
          # ships recent taps, so a failed refresh only means slightly older
          # formulae. Retry, then carry on regardless and let `brew install`
          # (which IS fatal) be the real gate.
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          for i in 1 2 3; do brew update && break || sleep 15; done || true
          brew install gcc ninja cmake
          gcc-16 --version

      - name: Cache FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: build/*/_deps
          key: deps-linux-gcc16-release-${{ hashFiles('cmake/Dependencies.cmake') }}
          # NO restore-keys: the key hashes Dependencies.cmake, and a PREFIX
          # fallback would restore a _deps tree built from different pins.
          # FETCHCONTENT_UPDATES_DISCONNECTED then forbids fetching the ref
          # the new pin names, so the configure dies instead of self-healing
          # (exactly what a welder pin bump hit). Exact match or cold fetch.

      # Static libstdc++/libgcc so the binary also runs on the integration box,
      # which has its own (apt) gcc-16 whose runtime need not match Homebrew's.
      # glibc is fine as-is — the hosted image's is older than the box's.
      - name: Configure
        run: >-
          cmake --preset gcc16-release
          -DWOWLIB_WERROR=ON
          -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"

      - name: Build
        run: cmake --build --preset gcc16-release

      - name: Test
        run: ctest --preset gcc16-release

      # Homebrew gcc stamps its own glibc loader as the ELF interpreter and
      # RUNPATHs under /home/linuxbrew — none of which exist on the test box.
      # Repoint at the system loader; the remaining NEEDED set is system
      # libraries only.
      - name: Make the test binary portable
        run: |
          sudo apt-get install -y patchelf
          patchelf --set-interpreter /lib64/ld-linux-x86-64.so.2 --remove-rpath \
            build/release/tests/wowlib_tests
          readelf -p .interp build/release/tests/wowlib_tests

      - name: Upload test binary
        uses: actions/upload-artifact@v4
        with:
          name: wowlib-tests-linux-x86_64
          path: build/release/tests/wowlib_tests
          if-no-files-found: error
          retention-days: 3

  # Client-integration suite on the self-hosted runner that carries real
  # client installs under /root/WoWClients (one directory per canonical
  # version: 1.12.1, 2.4.3, 3.3.5a, ...). Never runs for pull_request events:
  # the runner executes as root on the CI box and this is a public repository
  # — fork PRs must not reach it.
  integration:
    if: github.event_name != 'pull_request'
    needs: release
    runs-on: [self-hosted, wowlib-clients]
    timeout-minutes: 120
    env:
      WOWLIB_TEST_CLIENTS_DIR: /root/WoWClients
      WOWLIB_TEST_LISTFILE: /root/WoWClients/community-listfile.csv
      # The checkout provides the fixture files the travelling binary needs.
      WOWLIB_TEST_DATA_DIR: ${{ github.workspace }}/tests/data
      # The box's /tmp is a small tmpfs; test scratch (per-client listfile
      # copies, project overlays) goes to the disk instead.
      TMPDIR: /root/tmp
    steps:
      - uses: actions/checkout@v7

      - name: Refresh community listfile (monthly)
        run: |
          if [ ! -s "$WOWLIB_TEST_LISTFILE" ] || \
             [ -n "$(find "$WOWLIB_TEST_LISTFILE" -mtime +30)" ]; then
            url=$(curl -s https://api.github.com/repos/wowdev/wow-listfile/releases/latest |
                  jq -r '.assets[] | select(.name=="community-listfile.csv") | .browser_download_url')
            curl -sL "$url" -o "$WOWLIB_TEST_LISTFILE"
          fi
          wc -l "$WOWLIB_TEST_LISTFILE"

      - name: Download test binary
        uses: actions/download-artifact@v4
        with:
          name: wowlib-tests-linux-x86_64

      # The full Catch2 suite: units plus every client-integration test — the
      # integration tests find the clients via WOWLIB_TEST_CLIENTS_DIR and
      # self-skip only for versions this box does not carry.
      - name: Test
        run: |
          chmod +x wowlib_tests
          ./wowlib_tests --durations yes

      - name: dbdgen unit tests
        run: PYTHONPATH=tools/dbdgen python3 -m unittest discover -s tools/dbdgen/tests

  bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - name: Install gcc-16 toolchain (Homebrew)
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix)/sbin" >> "$GITHUB_PATH"
          # `brew update` refreshes the taps and is the single flakiest step in
          # every job — a tap fetch failure killed a macOS run in 19s, before a
          # line of wowlib was compiled. It is also NOT fatal: the runner image
          # ships recent taps, so a failed refresh only means slightly older
          # formulae. Retry, then carry on regardless and let `brew install`
          # (which IS fatal) be the real gate.
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          for i in 1 2 3; do brew update && break || sleep 15; done || true
          brew install gcc ninja cmake
          gcc-16 --version

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # The stable-ABI (abi3) extension targets CPython >= 3.13; numpy backs
      # the zero-copy vector views when stubgen imports the built module.
      - name: Set up CPython 3.13
        run: |
          uv venv .venv --python 3.13
          uv pip install numpy

      - name: Cache FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: build/*/_deps
          key: deps-linux-bindings-${{ hashFiles('cmake/Dependencies.cmake') }}
          # NO restore-keys: the key hashes Dependencies.cmake, and a PREFIX
          # fallback would restore a _deps tree built from different pins.
          # FETCHCONTENT_UPDATES_DISCONNECTED then forbids fetching the ref
          # the new pin names, so the configure dies instead of self-healing
          # (exactly what a welder pin bump hit). Exact match or cold fetch.

      # Static libstdc++/libgcc + no RUNPATH: the module must import anywhere,
      # including the audit box (ci-audit downloads this artifact instead of
      # building its own), independent of whatever C++ runtime that machine
      # carries. The MODULE flags are the ones that matter: the nanobind
      # extension is a MODULE library, which never sees
      # CMAKE_SHARED_LINKER_FLAGS — passing only the SHARED flags left
      # libstdc++ dynamic for months, and the Homebrew 16.1->16.2 bump
      # (new GLIBCXX_3.4.36) then broke the audit import (2026-08-22).
      # release.yml has always passed both; auditwheel was its safety net.
      - name: Configure
        run: >-
          cmake --preset gcc16-bindings-release
          -DWOWLIB_WERROR=ON
          -DPython_EXECUTABLE=$PWD/.venv/bin/python
          -DCMAKE_MODULE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
          -DCMAKE_SHARED_LINKER_FLAGS="-static-libstdc++ -static-libgcc"

      - name: Build extension + stubs
        run: cmake --build --preset gcc16-bindings-release --target wowlib_py wowlib_pyi

      - name: Make the module portable
        run: |
          sudo apt-get install -y patchelf
          patchelf --remove-rpath build/release/bindings/python/wowlib.abi3.so
          # Hard gate (mirrors release.yml's wheel check): the GNU C++
          # runtime must be linked in, not a NEEDED dep — a dynamic
          # libstdc++ is exactly what broke the audit box on the Homebrew
          # 16.1->16.2 bump.
          if readelf -d build/release/bindings/python/wowlib.abi3.so \
              | grep -qiE 'libstdc\+\+|libgcc_s'; then
            echo '::error::wowlib.abi3.so links the GNU C++ runtime dynamically'
            readelf -d build/release/bindings/python/wowlib.abi3.so | grep NEEDED
            exit 1
          fi

      # Runs AFTER patchelf and BEFORE the upload, so what is exercised is the
      # exact artifact that ships (ci-audit consumes it) and a broken module is
      # never published. The tools mirror pyproject's `dev` group; the project
      # itself is deliberately NOT installed, since that would have
      # scikit-build rebuild the extension we just built. PYTHONPATH points the
      # import at the build tree (nothing is installed into .venv), MYPYPATH at
      # the matching stubs — pyproject anchors mypy_path at the DEBUG preset's
      # tree, which does not exist here.
      - name: Python binding tests
        run: |
          uv pip install pytest pytest-mypy-testing mypy
          # Deliberately NO LD_LIBRARY_PATH here: the runner's system
          # libstdc++ predates the Homebrew toolchain's, so a module that
          # still linked the C++ runtime dynamically could not import — this
          # run doubles as a live portability gate on the exact artifact
          # that ships (on top of the readelf check above).
          PYTHONPATH=$PWD/build/release/bindings/python \
          MYPYPATH=$PWD/build/release/bindings/python/stubs \
          .venv/bin/python -m pytest tests/python -q

      - name: Upload Python module + stubs
        uses: actions/upload-artifact@v4
        with:
          name: wowlib-python-linux-x86_64
          path: |
            build/release/bindings/python/wowlib.abi3.so
            build/release/bindings/python/stubs
          if-no-files-found: error

  # The C# surface: native shim + generated managed wrapper + facades, locked
  # by the dotnet test suite (tests/csharp) — the same role the bindings job's
  # pytest run plays for Python.
  csharp:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - name: Install gcc-16 toolchain (Homebrew)
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix)/sbin" >> "$GITHUB_PATH"
          # `brew update` refreshes the taps and is the single flakiest step in
          # every job — a tap fetch failure killed a macOS run in 19s, before a
          # line of wowlib was compiled. It is also NOT fatal: the runner image
          # ships recent taps, so a failed refresh only means slightly older
          # formulae. Retry, then carry on regardless and let `brew install`
          # (which IS fatal) be the real gate.
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          for i in 1 2 3; do brew update && break || sleep 15; done || true
          brew install gcc ninja cmake
          gcc-16 --version
          dotnet --version

      - name: Cache FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: build/*/_deps
          key: deps-linux-csharp-${{ hashFiles('cmake/Dependencies.cmake') }}
          # NO restore-keys: the key hashes Dependencies.cmake, and a PREFIX
          # fallback would restore a _deps tree built from different pins.
          # FETCHCONTENT_UPDATES_DISCONNECTED then forbids fetching the ref
          # the new pin names, so the configure dies instead of self-healing
          # (exactly what a welder pin bump hit). Exact match or cold fetch.

      - name: Configure
        run: cmake --preset gcc16-csharp -DWOWLIB_WERROR=ON

      - name: Build
        run: cmake --build --preset gcc16-csharp

      # dotnet-test the generated WoWLib project: managed wrapper + db facades
      # + format factories compile together, and the tests exercise them over
      # the just-built native shim. Same libstdc++ story as the bindings job:
      # the shim needs a GLIBCXX newer than the runner's system copy — point
      # the loader at the Homebrew toolchain that built it.
      - name: C# binding tests
        run: |
          export LD_LIBRARY_PATH="$(dirname "$(find "$(brew --prefix gcc)/lib" \
            -name libstdc++.so.6 | head -1)"):${LD_LIBRARY_PATH:-}"
          dotnet test tests/csharp
