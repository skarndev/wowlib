name: ci-audit

# The exhaustive round-trip audit: every file of every format of every client
# on the box, driven by pytest over the Python bindings (tools/audit), with
# the per-file work in C++ (wowlib.audit.Auditor.roundtrip). Round-trip
# failures are report data, not job failures — the job only fails when the
# tool layer breaks. Nightly + on demand; never on pull_request (the box's
# runner executes as root and this is a public repository).
#
# Nothing is built here: the audit reuses the portable Python module the
# ci-linux bindings job uploads on every source push (static libstdc++,
# RUNPATH stripped) — the box itself cannot compile wowlib (apt gcc-16
# rejects the reflection code) and a duplicate hosted build costs ~75 min.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      audit_clients:
        description: 'comma-separated client dirs (default all present)'
        required: false
        default: ''
      audit_formats:
        description: 'comma-separated formats from wmo,m2,adt,wdt,wdl,blp'
        required: false
        default: ''
      max_per_format:
        description: 'cap on files per client x format (0 = all)'
        required: false
        default: '0'

concurrency:
  group: ci-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: [self-hosted, wowlib-clients]
    timeout-minutes: 1440
    env:
      # The box's /tmp is a 1.9 GiB tmpfs; per-client listfile copies and
      # project scratch belong on the disk (an ENOSPC there once truncated a
      # listfile copy and zeroed a client's enumeration).
      TMPDIR: /root/tmp
    steps:
      - uses: actions/checkout@v4

      # The newest successful main ci-linux run still holding the module
      # artifact — on the nightly cron that is simply "the last built main".
      - name: Locate the newest ci-linux module
        id: module
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'ci-linux.yml',
              branch: 'main', status: 'success', per_page: 20 });
            for (const run of data.workflow_runs) {
              const arts = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo, run_id: run.id });
              if (arts.data.artifacts.some(
                    a => a.name === 'wowlib-python-linux-x86_64' && !a.expired)) {
                core.setOutput('run_id', String(run.id));
                core.info(`using ci-linux run ${run.id} (${run.head_sha})`);
                return;
              }
            }
            core.setFailed('no successful ci-linux run holds the module artifact');

      - name: Download module
        uses: actions/download-artifact@v4
        with:
          name: wowlib-python-linux-x86_64
          path: pymod
          run-id: ${{ steps.module.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Run the audit
        env:
          PYTHONPATH: ${{ github.workspace }}/pymod
        run: |
          args=()
          [ -n "${{ inputs.audit_clients }}" ] && args+=(--audit-clients "${{ inputs.audit_clients }}")
          [ -n "${{ inputs.audit_formats }}" ] && args+=(--audit-formats "${{ inputs.audit_formats }}")
          [ -n "${{ inputs.max_per_format }}" ] && [ "${{ inputs.max_per_format }}" != "0" ] && \
            args+=(--max-per-format "${{ inputs.max_per_format }}")
          mkdir -p audit-report
          # Round-trip failures are report data and do not fail tests; a
          # nonzero pytest exit means the tool layer itself broke, which
          # should fail the job.
          # -s: no capture, so the sweep's streamed progress lines (and the
          # ::group:: per-cell folding) reach the live log as they happen.
          /root/audit-venv/bin/python -m pytest tools/audit -q -s \
            --clients-dir /root/WoWClients \
            --listfile /root/WoWClients/community-listfile.csv \
            --report-dir "$PWD/audit-report" \
            "${args[@]}" 2>&1 | tee audit-report/console.txt
          exit "${PIPESTATUS[0]}"

      # if: always() — a failed sweep's partial report is exactly the evidence
      # needed (a 7-hour run once died at the very end and uploaded nothing).
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit-report/
          if-no-files-found: error
          retention-days: 30
