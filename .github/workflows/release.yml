name: release

# Publishing runs off a TAG, never a branch push: `git tag v0.1.0 && git push
# origin v0.1.0`. The version is not written anywhere in the tree — the Python
# side resolves it from the tag through scikit-build-core's setuptools-scm
# metadata plugin, and the C# side is handed the same string as a CMake cache
# variable, so both artifacts of a release always carry one number.
on:
  push:
    tags: ['v*']
  # A full dress rehearsal: builds and packs everything, publishes nothing.
  # Use this before the first real tag — the publish steps are the only part
  # that cannot be undone.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or SHA to build (defaults to the current branch)'
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never kill a half-published release

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # Everything downstream keys off this: the version string, and whether this
  # run is allowed to publish. Cheap, so a mistake costs seconds rather than
  # the two hours the matrix takes.
  guard:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0            # setuptools-scm needs the history AND tags
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve version and publish gate
        id: v
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF#refs/tags/}"
            version="${tag#v}"
            # A tag is not "on" a branch, so state the intent explicitly: the
            # commit it names must be an ancestor of main. Catches a tag pushed
            # from a feature branch or a stale local main.
            git fetch --quiet origin main
            if ! git merge-base --is-ancestor "$tag^{commit}" origin/main; then
              echo "::error::tag $tag is not contained in origin/main — refusing to publish"
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            # Dry run: derive a version for the build, publish nothing.
            # describe's raw output (v0.0.4-3-gabc) is neither PEP 440 nor
            # NuGet-valid and fails the builds through the pinned version;
            # <last-tag>.<commit-count> (0.0.4.412) is legal in both.
            base="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')"
            [ -n "$base" ] || base=0.0.0
            version="$base.$(git rev-list --count HEAD)"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version"

  # --------------------------------------------------------------------------
  # Python wheels. One abi3 wheel per platform (cp313+), each built with the
  # gcc-16 toolchain the library requires — which is why this cannot use
  # cibuildwheel: the manylinux images carry no compiler new enough for C++26
  # reflection. The C++ runtime is linked STATICALLY into every wheel so the
  # extension imports on machines without a matching libstdc++.
  wheels:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: linux-x64 }
          - { os: macos-latest,   name: macos-arm64,  deployment: '14.0' }
          # NO INTEL macOS LEG YET. cmake/DarwinAtomProbe.cmake — the configure
          # gate for the gcc-16 Mach-O literal-atom miscompile (GCC PR 126723)
          # — is written in aarch64 assembly (adrp/@PAGE/@PAGEOFF) and cannot
          # assemble on x86_64, so the leg cannot configure. The bug affects
          # x86_64 too, so the probe must be PORTED, never skipped: an
          # unverified Intel wheel would corrupt string data silently. Restore
          # `{ os: macos-26-intel, name: macos-x64, deployment: '13.0' }` here
          # once the probe has an x86_64 variant. (`macos-13` is retired — an
          # unschedulable label queues forever instead of failing.)
          - { os: windows-latest, name: windows-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    defaults:
      run:
        shell: ${{ startsWith(matrix.os, 'windows') && 'msys2 {0}' || 'bash' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      # The interpreter the wheel is BUILT AGAINST. abi3/stable-ABI means one
      # wheel serves every later 3.x, and on Windows it must be the MSVC CPython
      # (not MSYS2's) so the .pyd links python3.dll and loads in a stock install.
      - name: Set up CPython 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install gcc-16 toolchain (Homebrew)
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
            echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
            echo "$(brew --prefix)/sbin" >> "$GITHUB_PATH"
          fi
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          for i in 1 2 3; do brew update && break || sleep 15; done || true
          brew install gcc ninja cmake
          gcc-16 --version

      - name: Install gcc-16 toolchain (MSYS2 UCRT64)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Cache FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: build/*/_deps
          key: deps-${{ matrix.name }}-wheel-${{ hashFiles('cmake/Dependencies.cmake') }}
          # NO restore-keys — see the note in ci-linux.yml: a prefix fallback can
          # restore a _deps tree built from different pins, which
          # FETCHCONTENT_UPDATES_DISCONNECTED then refuses to update.

      - name: Build wheel
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment }}
          # Pin the version instead of letting setuptools-scm re-derive it per
          # runner. It reads the WORKTREE, and on Windows the checkout is made
          # by Windows Git while the build runs under MSYS2's git — the CRLF
          # handling differs, tracked files look modified, and a "dirty" tree
          # becomes <tag>.post1.dev0. That is how 0.0.1's Windows wheel was
          # published to PyPI as 0.0.1.post1.dev0, a separate release. The tag
          # is still the single source of truth: `guard` derives this from it.
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.guard.outputs.version }}
          # Static C++ runtime: a wheel is installed on machines that have no
          # Homebrew/MSYS2 gcc, so nothing outside the system libs may be a
          # runtime dependency of the extension. It is applied to
          # CMAKE_MODULE_LINKER_FLAGS: a Python extension is a MODULE library,
          # NOT a shared one, so CMAKE_SHARED_LINKER_FLAGS never reaches its
          # link line (which is why the wheel kept coming out linked against
          # libstdc++.so.6 — and why auditwheel then rejected it for
          # too-recent GLIBCXX symbols, a confusing second-order symptom).
          # SHARED is set too, for anything else the build links.
          WOWLIB_STATIC_CXX: -static-libstdc++ -static-libgcc
        run: |
          set -euo pipefail
          # On Windows this step runs in the MSYS2 shell, which has NO `python`
          # on PATH: the interpreter we build against is deliberately the MSVC
          # CPython from setup-python (so the .pyd links python3.dll and loads
          # in a stock install), and MSYS2's own python is not installed. So
          # resolve the interpreter FIRST and use it for everything — a bare
          # `python` here is what failed the first release run.
          if [ "$RUNNER_OS" = "Windows" ]; then
            PY=$(cygpath -m "$pythonLocation/python.exe")
          else
            PY=python
          fi
          "$PY" --version
          "$PY" -m pip install --upgrade build
          if [ "$RUNNER_OS" = "Windows" ]; then
            # MSYS2 names the compiler plainly (gcc/g++, not gcc-16), and the
            # target interpreter must be spelled for CMake explicitly.
            "$PY" -m build --wheel \
              -C cmake.define.CMAKE_MODULE_LINKER_FLAGS="$WOWLIB_STATIC_CXX" \
              -C cmake.define.CMAKE_SHARED_LINKER_FLAGS="$WOWLIB_STATIC_CXX" \
              -C cmake.define.CMAKE_C_COMPILER=gcc \
              -C cmake.define.CMAKE_CXX_COMPILER=g++ \
              -C cmake.define.Python_EXECUTABLE="$PY"
          else
            "$PY" -m build --wheel \
              -C cmake.define.CMAKE_MODULE_LINKER_FLAGS="$WOWLIB_STATIC_CXX" \
              -C cmake.define.CMAKE_SHARED_LINKER_FLAGS="$WOWLIB_STATIC_CXX"
          fi
          ls -lh dist/

      # Prove the intent actually took: if the extension still needs a C++
      # runtime from the build machine, the wheel is not portable — and on
      # Linux that is exactly what makes auditwheel refuse to repair it. Fail
      # here, where the cause is obvious, rather than at the repair step.
      - name: Assert the C++ runtime is static
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Windows) pat='wowlib*.pyd'; dump='objdump -p' ;;
            macOS)   pat='wowlib*.so';  dump='otool -L' ;;
            *)       pat='wowlib*.so';  dump='ldd' ;;
          esac
          mod=$(find build -name "$pat" | head -1)
          # An empty `mod` must not pass vacuously — that is how the previous
          # version of this check reported success on a wheel that was in fact
          # dynamically linked.
          [ -n "$mod" ] || { echo "::error::no built extension found to check"; exit 1; }
          echo "checking $mod"
          $dump "$mod" || true
          # NOT `! cmd`: bash exempts a negated command from `set -e`, so a
          # failed assertion would be ignored and the step would pass.
          if $dump "$mod" | grep -qiE 'libstdc\+\+|libgcc_s|libwinpthread'; then
            echo "::error::$mod still links a dynamic C++ runtime — the wheel is not portable"
            exit 1
          fi
          echo "no dynamic C++ runtime dependency"

      # A linux_x86_64 wheel is rejected by PyPI outright; auditwheel retags it
      # to the manylinux level the build actually requires. With the C++ runtime
      # static there is normally nothing left to bundle — this is a relabel plus
      # an audit that no unexpected shared dependency crept in.
      - name: Repair wheel (manylinux tag)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y patchelf
          python -m pip install auditwheel
          python -m auditwheel show dist/*.whl || true
          python -m auditwheel repair dist/*.whl -w wheelhouse/
          rm -rf dist && mv wheelhouse dist
          ls -lh dist/

      # macOS: same idea, delocate rewrites/bundles any non-system dylib and
      # normalises the platform tag to the deployment target.
      - name: Repair wheel (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          python -m pip install delocate
          delocate-listdeps --all dist/*.whl
          delocate-wheel -w wheelhouse/ -v dist/*.whl
          rm -rf dist && mv wheelhouse dist
          ls -lh dist/

      # Install the built wheel into a clean interpreter and import it. This is
      # the step that catches a wheel that builds but cannot load — a missing
      # runtime, a wrong ABI tag, a stripped-away dependency.
      - name: Smoke-test the wheel
        shell: bash
        run: |
          set -euo pipefail
          VENV="${RUNNER_TEMP:-/tmp}/whltest"
          python -m venv "$VENV"
          if [ "$RUNNER_OS" = "Windows" ]; then PY="$VENV/Scripts/python.exe"; else PY="$VENV/bin/python"; fi
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install dist/*.whl
          "$PY" -c "import wowlib; print('wowlib', wowlib.__version__ if hasattr(wowlib,'__version__') else '(no __version__)'); print(wowlib.__file__)"
          # The wheel is also the typing story: it must carry the PEP 561
          # wowlib-stubs tree (mypy/pyright/IDEs discover it automatically
          # once installed). A wheel without it would install and import
          # fine, silently shipping an untyped release.
          "$PY" - <<'CHECK'
          import pathlib, sys, sysconfig
          stubs = pathlib.Path(sysconfig.get_path("purelib")) / "wowlib-stubs"
          missing = [p for p in ("__init__.pyi", "py.typed", "db/__init__.pyi",
                                 "db/tables/wotlk.pyi")
                     if not (stubs / p).is_file()]
          if missing:
              sys.exit(f"::error::wheel is missing stub files: {missing}")
          print(f"stub tree OK: {sum(1 for _ in stubs.rglob('*.pyi'))} .pyi files")
          CHECK

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # The C# side needs one native library per RID, and ONE managed wrapper — the
  # generated C# is platform-independent (it is a reflection of the C++ surface),
  # so it is taken from the Linux leg and the other legs contribute only their
  # native library.
  csharp-generate:
    needs: guard
    runs-on: ubuntu-latest
    # Post-generic-DB-rework budget: the surface lost the ~8.5k per-era table
    # classes, the generator is sharded per format (~5 min wall), and the
    # shim TUs average ~20 s. Measured locally: the whole leg fits in well
    # under an hour even on a 4-core runner; 150 is generous headroom, and a
    # regression should FAIL, not absorb six hours of runner time.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Install gcc-16 toolchain (Homebrew)
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
            echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
            echo "$(brew --prefix)/sbin" >> "$GITHUB_PATH"
          fi
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          for i in 1 2 3; do brew update && break || sleep 15; done || true
          brew install gcc ninja cmake

      - name: Install gcc-16 toolchain (MSYS2 UCRT64)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python

      - name: Install Python (dbdgen runs the table generator)
        if: runner.os != 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: build/csharp/_deps
          key: deps-linux-x64-csharp-${{ hashFiles('cmake/Dependencies.cmake') }}

      # Historical note: the single-TU generator peaked near the runner's
      # 16 GB and needed 16 GB of extra swap on /mnt to survive (the stock
      # image's small /swapfile is active — `fallocate: Text file busy`).
      # The generator is now sharded (dbdgen --cs-gen-out): the ClientDB
      # welds compile as 16 side TUs contributing into gen.cpp's document,
      # and the peak TU is ~2 GB. No swap needed; the pool cap below is
      # what keeps concurrent reflection TUs inside physical RAM.

      # The adaptive pool (RAM / 2 GB, sized to the post-rework TUs) fits the
      # hosted runners now that no binding TU drags the table headers along.
      - name: Configure
        run: |
          set -euo pipefail
          EXTRA=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXTRA="-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++"
          else
            EXTRA="-DCMAKE_C_COMPILER=gcc-16 -DCMAKE_CXX_COMPILER=g++-16"
          fi
          # The C++ runtime is linked statically for the same reason as the
          # wheel: the dylib ships to machines with no gcc-16 runtime.
          cmake -S . -B build/csharp -G Ninja $EXTRA \
            -DCMAKE_BUILD_TYPE=Release \
            -DWOWLIB_BUILD_TESTS=OFF \
            -DWOWLIB_BUILD_CSHARP=ON \
            -DWOWLIB_CSHARP_PACKAGE_VERSION="${{ needs.guard.outputs.version }}" \
            -DCMAKE_SHARED_LINKER_FLAGS="-static-libstdc++ -static-libgcc"

      - name: Build the native shim
        run: |
          set -euo pipefail
          cmake --build build/csharp --target wowlib_cs

      # Same portability bar as the wheels: the native library ships to
      # machines with no MinGW/Homebrew toolchain, so no toolchain-owned
      # runtime (libstdc++, libgcc, libwinpthread) may remain a dynamic
      # dependency. 0.0.4's win-x64 DLL imported libwinpthread-1.dll and
      # failed to load on stock Windows — this fails the build where the
      # cause is legible instead.
      - name: Assert no toolchain runtime dependency
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Windows) lib=build/csharp/bindings/wowlib_native.dll; dump='objdump -p' ;;
            macOS)   lib=build/csharp/bindings/libwowlib_native.dylib; dump='otool -L' ;;
            *)       lib=build/csharp/bindings/libwowlib_native.so; dump='ldd' ;;
          esac
          [ -f "$lib" ] || { echo "::error::$lib not found to check"; exit 1; }
          $dump "$lib" || true
          if $dump "$lib" | grep -qiE 'libstdc\+\+|libgcc_s|libwinpthread'; then
            echo "::error::$lib depends on a toolchain runtime library — not portable"
            exit 1
          fi
          echo "no toolchain runtime dependency"

      - name: Stage the native library
        run: |
          set -euo pipefail
          mkdir -p out
          cp "build/csharp/bindings/libwowlib_native.so" "out/libwowlib_native.so"
          ls -lh out/

      # One leg also carries the managed wrapper and the packable csproj.
      # The Linux leg is the ONLY one that runs the generator, so it also
      # publishes what the generator produced: the managed wrapper for the
      # NuGet job, and the shim sources the other platforms compile instead of
      # regenerating (see the `generated-sources` artifact consumed above).
      - name: Stage the generated sources
        run: |
          set -euo pipefail
          mkdir -p managed generated
          cp build/csharp/bindings/csharp/Bindings.*.cs managed/
          # The typed facades are part of the managed surface: the dbdgen
          # per-table classes (Facades.*.cs) and the per-era format factories
          # (FormatFacades.cs). Locally they ride welder-csharp's csproj via
          # EXTRA_COMPILE; the nuget job below writes its OWN csproj, so they
          # must travel in this artifact — 0.0.3/0.0.4 shipped without them
          # (no MapWotlk, no ForVersion) because this step staged only the
          # Bindings files.
          cp build/csharp/generated/cs_facades/Facades.*.cs managed/
          cp build/csharp/generated/cs_facades/FormatFacades.cs managed/
          cp build/csharp/bindings/csharp/Bindings.*.cs generated/
          cp build/csharp/bindings/csharp/shim.*.cpp generated/
          echo "$(ls managed | wc -l) managed file(s), $(ls generated/shim.*.cpp | wc -l) shim TU(s)"

      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-x64
          path: out/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: managed-wrapper
          path: managed/*.cs
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: generated-sources
          path: generated/*
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # One package carrying every RID's native library, which is what makes it
  # usable cross-platform: NuGet's runtime probing picks the right one at load
  # time. Built here rather than by the CMake helper, whose csproj can only ever
  # know the platform it ran on.

  csharp-native:
    needs: [guard, csharp-generate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   rid: osx-arm64,  lib: libwowlib_native.dylib }
          # osx-x64 is absent for the same reason as the wheels matrix above —
          # the Darwin atom probe has no x86_64 variant yet.
          - { os: windows-latest, rid: win-x64,    lib: wowlib_native.dll }
    runs-on: ${{ matrix.os }}
    # 350, not the default 240: the macOS leg hit exactly 240 and was cancelled
    # mid-build on 0.0.1. That runner is 3 cores / 7 GB and compiles 32 shim
    # shards that each re-parse the whole welded surface — Windows, with twice
    # the cores, needed 155 minutes. 350 leaves headroom under GitHub's 360
    # ceiling. With both publishes now gated on every artifact, a leg that
    # times out blocks the entire release, so the budget has to be generous.
    timeout-minutes: 90
    defaults:
      run:
        shell: ${{ startsWith(matrix.os, 'windows') && 'msys2 {0}' || 'bash' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Install gcc-16 toolchain (Homebrew)
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
            echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
            echo "$(brew --prefix)/sbin" >> "$GITHUB_PATH"
          fi
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          for i in 1 2 3; do brew update && break || sleep 15; done || true
          brew install gcc ninja cmake

      - name: Install gcc-16 toolchain (MSYS2 UCRT64)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python

      - name: Install Python (dbdgen runs the table generator)
        if: runner.os != 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: build/csharp/_deps
          key: deps-${{ matrix.rid }}-csharp-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Fetch the generated shim sources
        uses: actions/download-artifact@v4
        with:
          name: generated-sources
          path: generated

      - name: Configure
        run: |
          set -euo pipefail
          EXTRA=""
          LINK="-static-libstdc++ -static-libgcc"
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXTRA="-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++"
            # MinGW's posix-threads gcc links libwinpthread-1.dll DYNAMICALLY
            # even with the two static-runtime flags above — a consumer
            # without MSYS2 on PATH then fails at the first P/Invoke (user
            # report on 0.0.4). -static pulls every toolchain-owned library,
            # winpthread included, into the DLL; system import libs
            # (kernel32, the UCRT api-sets) are unaffected. The wheel leg
            # never had this problem — only this DLL did.
            LINK="$LINK -static"
          else
            EXTRA="-DCMAKE_C_COMPILER=gcc-16 -DCMAKE_CXX_COMPILER=g++-16"
          fi
          # The C++ runtime is linked statically for the same reason as the
          # wheel: the dylib ships to machines with no gcc-16 runtime.
          cmake -S . -B build/csharp -G Ninja $EXTRA \
            -DCMAKE_BUILD_TYPE=Release \
            -DWOWLIB_BUILD_TESTS=OFF \
            -DWOWLIB_BUILD_CSHARP=ON \
            -DWOWLIB_CSHARP_PACKAGE_VERSION="${{ needs.guard.outputs.version }}" \
            -DWOWLIB_CS_PREGENERATED_DIR="$PWD/generated" \
            -DCMAKE_SHARED_LINKER_FLAGS="$LINK"

      # The whole premise of this job is that it compiles PRE-GENERATED
      # sources. On v0.0.2 the welder-csharp pin predated PREGENERATED_DIR,
      # cmake_parse_arguments silently dropped the flag, and this leg rebuilt
      # and ran the full generator — 306 of the macOS job's 325 minutes went
      # to that one TU swapping on a 7 GB runner. welder-csharp now FATALs on
      # unknown keywords, and this asserts the other direction: if the
      # generator target exists in the graph at all, the pregenerated path was
      # not taken — fail in seconds, not hours.
      - name: Assert the generator is not in this build
        run: |
          set -euo pipefail
          if ninja -C build/csharp -t targets all | grep -q "wowlib_cs_gen"; then
            echo "::error::wowlib_cs_gen is in the build graph — PREGENERATED_DIR was not honoured"
            exit 1
          fi
          echo "OK: generator absent; this leg only compiles pregenerated sources"

      - name: Build the native shim
        run: |
          set -euo pipefail
          cmake --build build/csharp --target wowlib_cs

      # Same portability bar as the wheels: the native library ships to
      # machines with no MinGW/Homebrew toolchain, so no toolchain-owned
      # runtime (libstdc++, libgcc, libwinpthread) may remain a dynamic
      # dependency. 0.0.4's win-x64 DLL imported libwinpthread-1.dll and
      # failed to load on stock Windows — this fails the build where the
      # cause is legible instead.
      - name: Assert no toolchain runtime dependency
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Windows) lib=build/csharp/bindings/wowlib_native.dll; dump='objdump -p' ;;
            macOS)   lib=build/csharp/bindings/libwowlib_native.dylib; dump='otool -L' ;;
            *)       lib=build/csharp/bindings/libwowlib_native.so; dump='ldd' ;;
          esac
          [ -f "$lib" ] || { echo "::error::$lib not found to check"; exit 1; }
          $dump "$lib" || true
          if $dump "$lib" | grep -qiE 'libstdc\+\+|libgcc_s|libwinpthread'; then
            echo "::error::$lib depends on a toolchain runtime library — not portable"
            exit 1
          fi
          echo "no toolchain runtime dependency"

      - name: Stage the native library
        run: |
          set -euo pipefail
          mkdir -p out
          cp "build/csharp/bindings/${{ matrix.lib }}" "out/${{ matrix.lib }}"
          ls -lh out/

      # One leg also carries the managed wrapper and the packable csproj.
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: out/*
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # One package carrying every RID's native library, which is what makes it
  # usable cross-platform: NuGet's runtime probing picks the right one at load
  # time. Built here rather than by the CMake helper, whose csproj can only ever
  # know the platform it ran on.
  nuget:
    # csharp-generate too: it supplies the linux-x64 native library AND the
    # managed wrapper, neither of which csharp-native produces.
    needs: [guard, csharp-generate, csharp-native]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ inputs.ref || github.ref }}' }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/download-artifact@v4
        with: { pattern: 'native-*', path: natives }

      - uses: actions/download-artifact@v4
        with: { name: managed-wrapper, path: managed }

      - name: Write the multi-RID package project
        run: |
          set -euo pipefail
          mkdir -p pack
          cat > pack/WoWLib.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net8.0</TargetFramework>
              <PackageId>WoWLib</PackageId>
              <Version>__VERSION__</Version>
              <Authors>skarndev</Authors>
              <Description>Read and write World of Warcraft client files — a C++26 core with C#/.NET bindings.</Description>
              <PackageLicenseExpression>MIT</PackageLicenseExpression>
              <PackageProjectUrl>https://github.com/skarndev/wowlib</PackageProjectUrl>
              <RepositoryUrl>https://github.com/skarndev/wowlib</RepositoryUrl>
              <Nullable>enable</Nullable>
              <AllowUnsafeBlocks>true</AllowUnsafeBlocks>
              <ImplicitUsings>disable</ImplicitUsings>
              <EnableDefaultCompileItems>false</EnableDefaultCompileItems>
              <AppendTargetFrameworkToOutputPath>false</AppendTargetFrameworkToOutputPath>
              <!-- Ships the XML sidecar IntelliSense reads for descriptions. -->
              <GenerateDocumentationFile>true</GenerateDocumentationFile>
              <!-- CS0108: the generated base fs verbs intentionally share the
                   concretes' signatures (the base dispatches to them). -->
              <NoWarn>$(NoWarn);CS1591;CS0649;CS1573;CS1572;CS0108</NoWarn>
            </PropertyGroup>
            <ItemGroup>
              <Compile Include="../managed/Bindings.*.cs" />
              <!-- The typed facades: dbdgen per-table classes + the per-era
                   format factories. Zero interop of their own. -->
              <Compile Include="../managed/Facades.*.cs" />
              <Compile Include="../managed/FormatFacades.cs" />
            </ItemGroup>
            <ItemGroup>
              <None Include="../natives/native-linux-x64/libwowlib_native.so"
                    Pack="true" PackagePath="runtimes/linux-x64/native/" />
              <None Include="../natives/native-osx-arm64/libwowlib_native.dylib"
                    Pack="true" PackagePath="runtimes/osx-arm64/native/" />
              <None Include="../natives/native-win-x64/wowlib_native.dll"
                    Pack="true" PackagePath="runtimes/win-x64/native/" />
            </ItemGroup>
          </Project>
          EOF
          sed -i "s/__VERSION__/${{ needs.guard.outputs.version }}/" pack/WoWLib.csproj
          find natives -type f | sort

      - name: Pack
        run: dotnet pack pack/WoWLib.csproj -c Release -o nupkg

      # Assert the package actually contains what makes it usable: the assembly,
      # the doc sidecar, and all four native libraries. A silently RID-less
      # package would install fine and then fail at the first P/Invoke.
      - name: Verify package contents
        run: |
          set -euo pipefail
          pkg=$(ls nupkg/*.nupkg)
          echo "== $pkg"
          unzip -l "$pkg"
          for want in \
            "lib/net8.0/WoWLib.dll" \
            "lib/net8.0/WoWLib.xml" \
            "runtimes/linux-x64/native/libwowlib_native.so" \
            "runtimes/osx-arm64/native/libwowlib_native.dylib" \
            "runtimes/win-x64/native/wowlib_native.dll"; do
            unzip -l "$pkg" | grep -q "$want" || { echo "::error::package is missing $want"; exit 1; }
          done
          # The typed facades must be IN the assembly, not just staged beside
          # it — 0.0.3/0.0.4 shipped a 2.4 MB assembly (instead of ~9 MB)
          # with no MapWotlk / ForVersion because the pack csproj compiled
          # only the Bindings files. Type/method names live as plain text in
          # the CLI metadata heaps, so a binary grep suffices.
          for sym in MapWotlk ForVersion; do
            if ! unzip -p "$pkg" lib/net8.0/WoWLib.dll | grep -qa "$sym"; then
              echo "::error::assembly is missing the typed facades ($sym not in metadata)"
              exit 1
            fi
          done
          echo "package carries the assembly (facades included), the XML docs and every built RID"

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: nupkg/*.nupkg
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Publication. Both jobs wait for EVERY artifact — wheels and the packed
  # NuGet package alike — so a release is all-or-nothing across the two
  # registries: no half-release where PyPI has a version NuGet never got. (That
  # is what 0.0.1 did, publishing to PyPI off a run whose C# matrix had already
  # failed, because this job needed only `wheels`.)
  #
  # Two registries cannot be committed atomically, so a push that fails AFTER
  # the other succeeded still splits them. The recovery is to re-run that one
  # job — the artifacts persist on the run and carry the same version, so it
  # republishes identically. Do NOT bump and re-tag for this: the versions
  # would then disagree, which is the thing being avoided.
  publish-pypi:
    needs: [guard, wheels, nuget]
    if: needs.guard.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: release          # a spot for required reviewers, if wanted
    permissions:
      id-token: write             # Trusted Publishing: OIDC, no stored secret
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: 'wheel-*', path: dist, merge-multiple: true }
      - run: ls -lh dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A re-tag after a partly-published release must be able to complete
          # it: PyPI rejects re-uploading a file it already has, which would
          # otherwise fail the job and strand the wheels that ARE missing.
          # (0.0.1 published its Linux and macOS wheels while the Windows one
          # went astray under a different version.) Adding files to an existing
          # release is allowed; replacing one is not, and this does not try to.
          skip-existing: true

  publish-nuget:
    needs: [guard, wheels, nuget]
    if: needs.guard.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write            # Trusted Publishing: OIDC, same as PyPI above
    steps:
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - uses: actions/download-artifact@v4
        with: { name: nupkg, path: nupkg }

      # Exchange the workflow's OIDC token for a temporary nuget.org API key.
      # The key lives ONE HOUR and is single-use, so this must sit immediately
      # before the push rather than at the top of the job. `user` is the
      # nuget.org profile name (not an email); it is not a credential, but the
      # NuGet docs recommend keeping it in a secret, and doing so means the
      # workflow names no account.
      - name: NuGet login (OIDC → short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: |
          dotnet nuget push nupkg/*.nupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
