[build-system]
requires = ["scikit-build-core>=0.10", "setuptools-scm>=8"]
build-backend = "scikit_build_core.build"

[project]
# The DISTRIBUTION name only — the import name stays `wowlib` (the extension
# module CMake installs), exactly as pillow installs PIL. `wowlib` on PyPI is
# taken by an unrelated, abandoned (last release 2018) Excel-conversion toolkit
# from another studio that also ships a top-level `wowlib` package, so the two
# cannot be installed side by side; nothing else about it overlaps with this
# library.
name = "wowlib-py"
# Sourced from the git tag, never edited here: scikit-build-core's setuptools-scm
# metadata plugin (the backend's equivalent of hatch-vcs) resolves it at build
# time, so `v0.1.0` publishes 0.1.0 and there is no version to bump — or to get
# out of step with what shipped. Needs the .git directory and full history
# (`fetch-depth: 0` in CI); an untagged tree builds a dev version, which PyPI
# would reject anyway. Building from an sdist works because the resolved version
# is baked into its PKG-INFO.
dynamic = ["version"]
description = "Read and write World of Warcraft client files — a C++26 core with Python bindings."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
# numpy is a genuine runtime dependency: the opaque vector bindings hand back
# zero-copy numpy arrays, and the generated stubs import numpy / numpy.typing.
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
dev = ["mypy>=1.11", "pytest>=8", "pytest-mypy-testing>=0.2", "ruff>=0.6"]
# Documentation site (docs/build.py). mkdocs-material renders the guide + the
# Python API (mkdocstrings over the .pyi stubs); `lark` is needed by welder's
# Doxygen INPUT_FILTER, which docs/build.py invokes with this interpreter. Doxygen
# itself (for the C++ reference) is a system tool, not a Python dependency.
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
  "lark>=1.2",
]

# The standard top-level form (dynamic-metadata 0.3). The older
# [tool.scikit-build.metadata.version] table still works but is deprecated in
# scikit-build-core 1.x, and the two cannot be combined.
[[tool.dynamic-metadata]]
field = "version"
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
# `v0.1.0` -> 0.1.0. No local version segment: setuptools-scm appends `+g<sha>`
# to any non-tag build, and PyPI rejects local versions outright — dropping it
# keeps an accidental non-tag build merely wrong-numbered rather than
# unpublishable-at-the-last-step.
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"

[tool.scikit-build]
# Reuse the same CMake tree CLion configures (build/bindings) so the C++ build and
# the Python editable install share one tree instead of diverging into two. nanobind
# is fetched by CMake (see cmake/Dependencies.cmake), so no build prerequisites
# beyond a Python interpreter and the gcc-16 toolchain.
build-dir = "build/bindings"
# Stable ABI (abi3): one wheel for CPython >= 3.13, GCC- or MSVC-built.
wheel.py-api = "cp313"
# Build only the extension and its stub tree, and scope the install to our own
# component so the FetchContent deps (StormLib/CascLib/nanobind/welder) — some of
# which carry their own install() rules — are never packaged into the wheel.
build.targets = ["wowlib_py", "wowlib_pyi"]
install.components = ["wowlib_python"]

[tool.scikit-build.cmake]
# Match the gcc16-bindings preset (Debug) so this install reuses the shared
# build/bindings tree in place instead of flipping its build type and forcing a
# full rebuild every time you switch between CLion and `pip install`.
build-type = "Release"

[tool.scikit-build.cmake.define]
WOWLIB_BUILD_PYTHON = "ON"
CMAKE_C_COMPILER = "gcc-16"
CMAKE_CXX_COMPILER = "g++-16"
# NO era override here. This file builds the WHEEL, so anything set here is what
# ships: a four-era list (once present for a faster local compile) silently cut
# the published surface to a quarter of the client databases, against the
# project's decision to expose every era (cmake/DbTables.cmake). The default —
# all eleven last-minor expansions — now applies to the wheel as it does to the
# C++ and C# builds. Cost, measured: the extension grows ~75 MB -> 135 MB
# installed but only ~23.5 MB -> ~26 MB compressed (native code packs ~5:1), and
# the build roughly doubles. Trim it on the COMMAND LINE for a fast local build
# (`-C cmake.define.WOWLIB_DB_ERAS=...`), never here.

[tool.mypy]
# The installed wowlib-stubs package (PEP 561) is what mypy resolves once the
# project is installed. This anchored path is a belt-and-suspenders fallback so
# mypy still finds the stubs straight from the build tree even before an install,
# regardless of mypy's working directory ($MYPY_CONFIG_FILE_DIR = this file's dir).
mypy_path = "$MYPY_CONFIG_FILE_DIR/build/bindings/bindings/python/stubs"
python_version = "3.13"

[tool.ruff]
# The Python surface is the hand-written binding glue and the smoke tests.
target-version = "py313"
extend-exclude = ["build"]

[tool.pytest.ini_options]
# Python-side tests exercise the hand-written binding surface + type-stub resolution
# against the installed extension. The typing/ *.mypy-testing cases (inline # R:/# E:
# assertions) are collected by pytest-mypy-testing.
testpaths = ["tests/python"]
addopts = "-ra"