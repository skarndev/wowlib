# What the C# API reference includes. First matching rule wins.
#
# The dbdgen-generated typed db facades (wowlib.Db.Tables) are one class +
# one row struct per (table x era) — thousands of near-identical types that
# would dominate the toc and the search index. Mirror the Python API docs:
# keep the REPRESENTATIVE Map family (the worked example the guide's db page
# walks through) and drop the rest; the per-table pattern is identical.
# Everything outside wowlib.Db.Tables is included in full.
apiRules:
- include:
    uidRegex: '^WoWLib\.Db\.Tables\.Map(Vanilla|Tbc|Wotlk|Cata|Mop|Wod|Legion|Bfa|Shadowlands|Dragonflight|TheWarWithin)(Row)?($|\.|`)'
- exclude:
    uidRegex: '^WoWLib\.Db\.Tables\.'
