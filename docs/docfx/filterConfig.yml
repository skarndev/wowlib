# What the C# API reference includes. First matching rule wins.
#
# - The nested `Enumerator` structs are the standard C# allocation-free
#   foreach pattern (the BCL's own List<T>.Enumerator is the precedent) — an
#   implementation detail nobody names, so their pages are dropped wholesale.
# - The dbdgen-generated typed db facades (WoWLib.Database.Tables) are one
#   class + one row struct per (table x era) — thousands of mechanically
#   generated types that would drown the toc and the search index. The
#   reference EXCLUDES the namespace entirely; the landing page and the
#   database guide describe the generation scheme (WoWDBDefs -> C# naming
#   conventions) and the per-table pattern, which is identical everywhere.
apiRules:
- exclude:
    uidRegex: '\.Enumerator($|`|\.)'
- exclude:
    uidRegex: '^WoWLib\.Database\.Tables($|\.)'
